name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-plugins:
    name: Validate plugin & marketplace manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate each plugin manifest
        run: |
          for plugin in plugins/*/; do
            echo "::group::claude plugin validate ${plugin}"
            claude plugin validate "${plugin%/}" --strict
            echo "::endgroup::"
          done

      - name: Validate marketplace manifest
        run: claude plugin validate . --strict

  build-index-and-site:
    name: Build catalog index and site
    runs-on: ubuntu-latest
    needs: validate-plugins
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build catalog index (site/public/*.json)
        run: node scripts/build-index.mjs

      - name: Confirm generated JSON is valid
        run: |
          node -e "
            for (const f of ['index.json','releases.json','stats.json']) {
              JSON.parse(require('fs').readFileSync('site/public/' + f, 'utf8'));
              console.log(f, 'OK');
            }
          "

      - name: Install site dependencies
        working-directory: site
        run: npm install

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Upload site build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          retention-days: 7

  eval-sdd-engineering:
    name: Run sdd-engineering eval suite
    runs-on: ubuntu-latest
    # Evals call a real model and cost real tokens — only run on PRs that
    # actually touch the plugin under eval, not on every unrelated change.
    if: contains(github.event.pull_request.labels.*.name, 'run-evals') || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run sdd-engineering eval cases
        run: claude plugin eval ./plugins/sdd-engineering --trust-plugin --allow-tools Write Edit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
